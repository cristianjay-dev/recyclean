<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RecyClean Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex bg-gray-100 min-h-screen">
  <!-- Sidebar -->
  <aside class="w-64 bg-gray-800 text-white flex flex-col p-4 space-y-4">
    <h2 class="text-2xl font-bold mb-6">RecyClean</h2>

    <nav class="flex flex-col space-y-2">
      <a href="{% url 'dashboard' %}"
         class="px-3 py-2 rounded {% if request.resolver_match.url_name == 'dashboard' %}bg-gray-900{% else %}hover:bg-gray-700{% endif %}">
        Dashboard
      </a>

      <a href="{% url 'dropoff_sites_view' %}"
         class="px-3 py-2 rounded {% if request.resolver_match.url_name == 'dropoff_sites_view' %}bg-gray-900{% else %}hover:bg-gray-700{% endif %}">
        Drop-off Sites
      </a>

      <a href="{% url 'staff_management_view' %}"
         class="px-3 py-2 rounded {% if request.resolver_match.url_name == 'staff_management_view' %}bg-gray-900{% else %}hover:bg-gray-700{% endif %}">
        Staff Management
      </a>

      <a href="{% url 'reward_requests' %}"
         class="px-3 py-2 rounded {% if request.resolver_match.url_name == 'reward_requests' %}bg-gray-900{% else %}hover:bg-gray-700{% endif %}">
        Rewards
      </a>

      <!-- renamed from quiz_dashboard → diy_dashboard -->
      <a href="{% url 'diy_dashboard' %}"
         class="px-3 py-2 rounded {% if request.resolver_match.url_name == 'diy_dashboard' %}bg-gray-900{% else %}hover:bg-gray-700{% endif %}">
        DIY Tutorials
      </a>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="flex-grow p-6">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
