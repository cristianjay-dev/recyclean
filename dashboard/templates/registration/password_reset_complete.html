<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Password updated • Recyclean</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-100 flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-6">
      <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">Recyclean</h1>
      <p class="text-sm text-gray-500 mt-1">Admin (superuser) password reset</p>
      <p class="text-xs text-gray-400 mt-1">Only Django <span class="font-medium">superusers</span> can reset here.</p>
    </div>

    <div class="bg-white shadow-lg rounded-2xl p-6">
      <h2 class="text-xl font-bold mb-1">Password updated</h2>
      <p class="text-sm text-gray-600">
        Your admin password has been set. You can now sign in with your new credentials.
      </p>

      <div class="mt-6 text-center">
        <a href="{% url 'login' %}" class="inline-flex items-center justify-center rounded-xl bg-blue-600 text-white px-4 py-3 text-base font-medium hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-200">
          Go to sign in
        </a>
      </div>
    </div>

    <p class="mt-8 text-center text-xs text-gray-400">© {% now "Y" %} Recyclean</p>
  </div>
</body>
</html>
