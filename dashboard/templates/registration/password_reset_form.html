<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reset password • Recyclean</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-100 flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white shadow-lg rounded-2xl p-6">
    <h1 class="text-2xl font-bold mb-1">Forgot password?</h1>
    <p class="text-sm text-gray-600 mb-6">Enter your account email and we’ll send a reset link.</p>

    <form method="post" class="space-y-4" novalidate>
      {% csrf_token %}

      {% if form.non_field_errors %}
        <div class="rounded-xl bg-red-50 text-red-700 text-sm px-4 py-3">
          {% for err in form.non_field_errors %}{{ err }}{% endfor %}
        </div>
      {% endif %}

      <div>
        <label for="{{ form.email.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
        {{ form.email.errors }}
        <input
          type="email"
          name="{{ form.email.html_name }}"
          id="{{ form.email.id_for_label }}"
          required
          autocomplete="email"
          placeholder="you@email.com"
          class="w-full rounded-xl px-4 py-3 text-base shadow-sm border border-gray-300 focus:border-blue-600 focus:ring-4 focus:ring-blue-100"
          value="{{ form.email.value|default_if_none:'' }}"
        />
      </div>

      <button class="w-full rounded-xl bg-blue-600 text-white px-4 py-3 text-base font-medium hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-200">
        Send reset link
      </button>
    </form>

    <div class="mt-6 text-center">
      <a href="{% url 'login' %}" class="text-sm text-blue-700 hover:underline">Back to sign in</a>
    </div>
  </div>
</body>
</html>
