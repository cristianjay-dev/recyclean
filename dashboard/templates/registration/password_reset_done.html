<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reset email sent • Recyclean</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-100 flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white shadow-lg rounded-2xl p-6 text-center">
    <h1 class="text-2xl font-bold mb-2">Check your email</h1>
    <p class="text-gray-600">
      If an account exists for that email, we’ve sent a link to reset your password.
    </p>
    <div class="mt-6">
      <a href="{% url 'login' %}" class="text-blue-700 hover:underline">Back to sign in</a>
    </div>
  </div>
</body>
</html>
