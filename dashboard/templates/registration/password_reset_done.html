<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Email sent • Recyclean</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-100 flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-6">
      <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">Recyclean</h1>
      <p class="text-sm text-gray-500 mt-1">Admin (superuser) password reset</p>
      <p class="text-xs text-gray-400 mt-1">Only Django <span class="font-medium">superusers</span> can reset here.</p>
    </div>

    <div class="bg-white shadow-lg rounded-2xl p-6">
      <h2 class="text-xl font-bold mb-2">Check your email</h2>
      <p class="text-sm text-gray-600">
        If an admin account exists for the email you entered, you’ll receive a password reset link shortly.
        The link will expire after a short time.
      </p>

      <div class="mt-6 text-center">
        <a href="{% url 'login' %}" class="text-sm text-blue-700 hover:underline">Back to sign in</a>
      </div>
    </div>

    <p class="mt-8 text-center text-xs text-gray-400">© {% now "Y" %} Recyclean</p>
  </div>
</body>
</html>
