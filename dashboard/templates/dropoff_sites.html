{% extends 'base.html' %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">Drop-off Sites</h1>

<table class="min-w-full bg-white rounded shadow">
  <thead class="bg-gray-200">
    <tr>
      <th class="text-left p-3">Barangay</th>
      <th class="text-left p-3">Assigned Staff</th>
    </tr>
  </thead>
  <tbody>
    {% for site in sites %}
    <tr 
      class="border-t hover:bg-gray-100 cursor-pointer"
      onclick="window.location.href='{% url 'dropoff_site_detail' site.id %}'">
      <td class="p-3">
        {{ site.barangay }}
      </td>
      <td class="p-3">
        {% if site.assigned_staff %}
          {{ site.assigned_staff.name }}
        {% else %}
          <span class="text-gray-500 italic">Unassigned</span>
        {% endif %}
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
