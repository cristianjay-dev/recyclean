{% extends 'base.html' %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">Drop-off Sites</h1>

<table class="min-w-full bg-white rounded shadow">
  <thead class="bg-gray-200">
    <tr>
      <th class="text-left p-3">Barangay</th>
      <th class="text-left p-3">Assigned Staff</th>
      <th class="text-left p-3">Actions</th>
    </tr>
  </thead>
  <tbody>
    {% for site in sites %}
    <tr class="border-t hover:bg-gray-100">
      <td class="p-3 cursor-pointer" onclick="window.location.href='{% url 'dropoff_site_detail' site.id %}'">
        {{ site.barangay }}
      </td>
      <td class="p-3">
        {% if site.assigned_staff %}
          {{ site.assigned_staff.name }}
        {% else %}
          <span class="text-gray-500 italic">Unassigned</span>
        {% endif %}
      </td>
      <td class="p-3">
        <button onclick="deleteSite({{ site.id }})" class="bg-red-600 text-white px-3 py-1 rounded hover:bg-red-700">
          Delete
        </button>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>

<script>
function deleteSite(siteId) {
  if (!confirm("Are you sure you want to delete this drop-off site?")) return;

  fetch(`/delete-dropoff-site/${siteId}/`, {
    method: "POST",
    headers: { "X-CSRFToken": "{{ csrf_token }}" }
  })
  .then(res => res.json())
  .then(data => {
    if (data.success) {
      alert("Drop-off site deleted successfully.");
      location.reload();
    } else {
      alert("Failed to delete drop-off site.");
    }
  });
}
</script>
{% endblock %}
