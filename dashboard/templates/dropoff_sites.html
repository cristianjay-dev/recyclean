{% extends 'base.html' %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">Drop-off Sites</h1>

<table class="min-w-full bg-white rounded shadow">
  <thead class="bg-gray-200">
    <tr>
      <th class="text-left p-3">Barangay</th>
      <th class="text-left p-3">Assigned Staff</th>
    </tr>
  </thead>
  <tbody>
    {% for site in sites %}
    <tr class="border-t">
      <td class="p-3">{{ site.barangay }}</td>
      <td class="p-3">
        {% if site.assigned_staff %}
          {{ site.assigned_staff.name }}
        {% else %}
          Unassigned
        {% endif %}
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
