{% extends 'base.html' %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">Pending Staff Requests</h1>

<table class="min-w-full bg-white rounded shadow">
  <thead class="bg-gray-200">
    <tr>
      <th class="text-left p-3">Name</th>
      <th class="text-left p-3">Barangay</th>
      <th class="text-left p-3">Mobile</th>
      <th class="text-left p-3">Actions</th>
    </tr>
  </thead>
  <tbody>
    {% for staff in pending_staff %}
    <tr class="border-t" id="staff-row-{{ staff.id }}">
      <td class="p-3">{{ staff.name }}</td>
      <td class="p-3">{{ staff.barangay }}</td>
      <td class="p-3">{{ staff.mobile_number }}</td>
      <td class="p-3 flex gap-2">
        <button onclick="confirmApprove({{ staff.id }}, '{{ csrf_token }}')" class="bg-green-600 text-white px-3 py-1 rounded">Approve</button>
        <button onclick="confirmReject({{ staff.id }}, '{{ csrf_token }}')" class="bg-red-600 text-white px-3 py-1 rounded">Reject</button>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>

<!-- ✅ Confirmation Modal -->
<div id="modal" class="fixed inset-0 bg-black bg-opacity-50 hidden justify-center items-center z-50">
  <div class="bg-white rounded p-6 w-full max-w-md text-center">
    <p id="modal-text" class="mb-4 text-lg font-medium"></p>
    <div class="flex justify-center gap-4">
      <button id="modal-confirm" class="bg-blue-600 text-white px-4 py-2 rounded">Confirm</button>
      <button onclick="closeModal()" class="bg-gray-400 text-white px-4 py-2 rounded">Cancel</button>
    </div>
  </div>
</div>

<!-- ✅ Success Toast -->
<div id="toast" class="fixed bottom-6 right-6 bg-green-600 text-white px-4 py-2 rounded shadow-lg hidden z-50">
  <span id="toast-message"></span>
</div>

<script>
  let action = null;
  let targetUserId = null;
  let csrf = null;

  function confirmApprove(userId, token) {
    action = "approve";
    targetUserId = userId;
    csrf = token;
    showModal("Are you sure you want to approve this staff?");
  }

  function confirmReject(userId, token) {
    action = "reject";
    targetUserId = userId;
    csrf = token;
    showModal("Are you sure you want to reject and delete this account?");
  }

  function showModal(message) {
    document.getElementById('modal-text').innerText = message;
    document.getElementById('modal').classList.remove('hidden');
    document.getElementById('modal').classList.add('flex');
  }

  function closeModal() {
    document.getElementById('modal').classList.add('hidden');
    document.getElementById('modal').classList.remove('flex');
    action = null;
    targetUserId = null;
  }

  function showToast(message) {
    const toast = document.getElementById('toast');
    const text = document.getElementById('toast-message');
    text.innerText = message;
    toast.classList.remove('hidden');

    setTimeout(() => {
      toast.classList.add('hidden');
    }, 3000); // hide after 3 seconds
  }

  document.getElementById("modal-confirm").addEventListener("click", function () {
    if (!action || !targetUserId) return;

    const url = action === "approve"
      ? `/approve-staff/${targetUserId}/`
      : `/reject-staff/${targetUserId}/`;

    fetch(url, {
      method: 'POST',
      headers: {
        'X-CSRFToken': csrf
      }
    })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        document.getElementById(`staff-row-${targetUserId}`).remove();
        showToast(action === "approve"
          ? "✅ Staff approved successfully!"
          : "🗑️ Staff rejected and deleted.");
      } else {
        alert("❌ Action failed.");
      }
    })
    .catch(err => {
      console.error(err);
      alert("⚠️ Server error.");
    })
    .finally(() => {
      closeModal();
    });
  });
</script>
{% endblock %}
